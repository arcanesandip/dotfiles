# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Enable clean programming ligatures
disable_ligatures never

# Modern Window Padding & Layout Aesthetics
window_padding_width 12
background_opacity   0.92

# Cursor & Performance
cursor_shape          beam
cursor_blink_interval 0.5
repaint_delay         10
input_delay           3
sync_to_monitor       yes
